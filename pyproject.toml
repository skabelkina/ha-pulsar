[tool.ruff]
required-version = ">=0.13.0"

[tool.ruff.lint]
select = [
  "A001",   # Variable {name} is shadowing a Python builtin
  "ASYNC",  # flake8-async
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C",      # complexity
  "D",      # docstrings
  "DTZ",    # flake8-datetimez
  "E",      # pycodestyle
  "F",      # pyflakes/autoflake
  "I",      # isort
  "INP",    # flake8-no-pep420
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "N",      # pep8-naming
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PT",     # flake8-pytest-style
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLF",    # flake8-self
  "T",      # flake8-print
  "TC",     # flake8-type-checking
  "TID",    # Tidy imports
  "TRY",    # tryceratops
  "UP",     # pyupgrade
  "W",      # pycodestyle
]

ignore = [
  "D202",     # No blank lines allowed after function docstring
  "D203",     # 1 blank line required before class docstring
  "D213",     # Multi-line docstring summary should start at the second line
  "D417",     # Missing argument descriptions in docstring
  "E501",     # line too long
  "PLR0911",  # Too many return statements
  "PLR0912",  # Too many branches
  "PLR0913",  # Too many arguments to function call
  "PLR0915",  # Too many statements
  "PT011",    # pytest.raises({exception}) is too broad
  "RUF001",   # String contains ambiguous unicode character
  "RUF002",   # Docstring contains ambiguous unicode character
  "RUF003",   # Comment contains ambiguous unicode character
  "SIM108",   # Use ternary operator
  "TC001",    # Move application import {} into a type-checking block
  "TC002",    # Move third-party import {} into a type-checking block
  "TC003",    # Move standard library import {} into a type-checking block
  "TRY003",   # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"async_timeout".msg = "use asyncio.timeout instead"
"pytz".msg = "use zoneinfo instead"
"tests".msg = "You should not import tests"

[tool.ruff.lint.per-file-ignores]
# Allow for scripts to write to stdout
"script/*" = ["T20"]

[tool.pyright]
# Suppress false positives for SensorEntityDescription keyword arguments
# These are valid arguments but type checker doesn't recognize them in frozen dataclass inheritance
reportCallIssue = false
reportArgumentType = false

